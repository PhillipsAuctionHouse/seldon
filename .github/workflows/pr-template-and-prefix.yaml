# Body only. Titles are owned by validate-pr.yaml (conventional-commit type,
# required scope, leading Jira ticket) — don't add title rules here too.
name: 'Validate PR Body Template'

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  check-body:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch (for PR template)
        uses: actions/checkout@v6

      - name: Enforce PR template body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          echo "Base branch: $PR_BASE"

          fail=0

          # PR body template rule — every bold section header in the template must appear in the PR body
          template_path=".github/PULL_REQUEST_TEMPLATE.MD"
          if [[ ! -f "$template_path" ]]; then
            echo "::error title=PR template missing::Could not find $template_path in the base branch."
            exit 1
          fi

          mapfile -t required_sections < <(grep -E '^\*\*[^*]+\*\*[[:space:]]*$' "$template_path" | sed 's/[[:space:]]*$//')
          if [[ ${#required_sections[@]} -eq 0 ]]; then
            echo "::error title=PR template unreadable::Extracted zero section headers from $template_path. The template may have been restructured — update the grep pattern in this workflow before merging."
            exit 1
          fi
          for section in "${required_sections[@]}"; do
            if [[ "$PR_BODY" != *"$section"* ]]; then
              echo "::error title=PR body template::PR body is missing required section '$section' from .github/PULL_REQUEST_TEMPLATE.MD. Rebuild the body from the template."
              fail=1
            fi
          done

          if [[ "$fail" -ne 0 ]]; then
            echo ""
            echo "See .github/PULL_REQUEST_TEMPLATE.MD and AGENTS.md 'Opening a Pull Request' for the required format."
            exit 1
          fi

          echo "PR body contains every required template section."
